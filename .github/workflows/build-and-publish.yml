# One build, both artifacts.
#
# This replaces pdf-generation.yml and generate-gif.yml, which fired on almost
# the same triggers and each spent about ninety seconds doing an identical
# checkout, pnpm install, apt install and Chrome download before building the
# same app twice. Doing it once halves that.
#
# Both artifacts are recorded from the build produced here, never from the
# deployed site. Deploys are manual (`pnpm run deploy`), so anything that
# fetches https://mrtysn.github.io/cv/ captures the previous version.
#
# Order matters: the PDF is what people download, so it is generated, checked
# and released first. The preview GIF is cosmetic and goes last, where a failure
# cannot cost us a PDF release.
#
# Release tags are deliberately separate. cv-latest and cv-<version> are deleted
# and recreated on every run, so the preview GIF has to live on its own tag or
# it would be destroyed here.
name: Build and publish

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**' # the generators live here; a change to them should be exercised
      - 'package.json'
  workflow_dispatch: # re-cut both artifacts on demand

# Without this, two pushes in quick succession interleave the release delete and
# create below, and one of them loses its assets.
concurrency:
  group: build-and-publish
  cancel-in-progress: true

permissions:
  contents: write # gh release create

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # pnpm latest requires Node >= 22.13

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0 # pinned: pnpm 11 (latest) errors on ignored build scripts

      - name: 📦 Install dependencies
        run: pnpm install # puppeteer is already a devDependency; no extra add needed
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      # ffmpeg is not on the ubuntu-latest image any more; without it
      # record-preview.js captures every frame and then dies at the encode.
      - name: 🔧 Install system dependencies for Puppeteer and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgbm1 libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxss1 libasound2t64
          ffmpeg -version | head -1

      - name: 🌐 Install Chrome for Puppeteer
        run: |
          CHROME_PATH=$(npx puppeteer browsers install chrome | grep chrome@ | awk '{print $2}')
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "Chrome installed at: $CHROME_PATH"

      - name: 🏗️ Build React application
        run: |
          npx update-browserslist-db@latest
          pnpm run build

      - name: 📄 Generate PDF
        run: node scripts/generate-pdf.js
        env:
          CI: 'true'

      # The released PDF is what people download, so the extraction check runs
      # here and not only in the local pre-commit hook. Fails the workflow
      # before anything is published.
      - name: 🔎 Check how an ATS reads the PDF
        run: ./scripts/check-cv-pdf

      - name: 🏷️ Get version
        id: version
        run: |
          VERSION=$(node -e "
            const fs = require('fs');
            const content = fs.readFileSync('src/constants.js', 'utf8');
            const match = content.match(/CV_VERSION\s*=\s*[\"']([^\"']+)[\"']/);
            console.log(match ? match[1] : 'v1.0');
          ")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Update rolling cv-latest release
        # cv-latest always holds the current PDF (delete + recreate so no stale
        # versioned assets accumulate). This is what the site download button uses.
        run: |
          gh release delete cv-latest --cleanup-tag --yes || true
          gh release create cv-latest pdfs/Mert_Yasin_CV_*.pdf \
            --title "CV PDF (latest)" \
            --notes "Current CV PDF — version ${{ steps.version.outputs.version }}, commit ${{ github.sha }}."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Update version release (cv-<version> tracks the version's latest commit)
        # While CV_VERSION is unchanged, advance cv-<version> to the current commit
        # (delete + recreate, like cv-latest) so it always points to that version's
        # last commit. When the version bumps, this tag stops moving and is left
        # sitting on the final commit of the previous version.
        run: |
          TAG="cv-${{ steps.version.outputs.version }}"
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" pdfs/Mert_Yasin_CV_*.pdf \
            --title "CV PDF ${{ steps.version.outputs.version }}" \
            --notes "CV PDF for ${{ steps.version.outputs.version }} (commit ${{ github.sha }})."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🎬 Record the preview GIF
        run: node scripts/record-preview.js

      - name: 🖼️ Publish to the cv-preview release
        run: |
          test -s cv-preview.gif || { echo "no GIF was produced"; exit 1; }
          ls -la cv-preview.gif
          gh release delete cv-preview --cleanup-tag --yes || true
          gh release create cv-preview cv-preview.gif \
            --title "CV preview GIF" \
            --notes "Preview recording of the site at commit ${{ github.sha }}. Referenced by README.md."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Summary
        run: |
          echo "PDF releases: cv-latest, cv-${{ steps.version.outputs.version }}"
          echo "Preview GIF:  cv-preview"
          echo "🔗 ${{ github.server_url }}/${{ github.repository }}/releases"
