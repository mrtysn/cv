# The preview GIF is published as a release asset, not committed to the repo.
#
# It used to be recorded and pushed back to master on every src/ change. The
# recording is not deterministic, so every run produced a different ~6 MB
# binary and the "did anything change?" guard never fired. Twenty-one revisions
# put .git at 98 MB for a repo that is otherwise a few hundred KB, and the bot's
# push raced every human push to master.
#
# Releases hold binaries without touching history, and the download URL is
# stable across delete + recreate, so README.md can point at one address
# forever. The tag must stay dedicated: pdf-generation.yml runs
# `gh release delete cv-latest --cleanup-tag`, so an asset parked there would be
# destroyed on the next PDF build.
name: Generate demo gif

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
  workflow_dispatch: # record on demand, e.g. after a styling-only change

# Concurrency, because the recording fetches the live GitHub Pages site: two
# overlapping runs would race the deploy and one would capture the old page.
concurrency:
  group: cv-preview-gif
  cancel-in-progress: true

permissions:
  contents: write # gh release create

jobs:
  generate-gif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🎬 Record the deployed site
        uses: PabloLec/website-to-gif@2.1.1
        with:
          url: "https://mrtysn.github.io/cv/"
          save_path: "/"
          file_format: "GIF"
          file_name: "cv-preview"
          window_width: 960
          window_height: 720
          final_width: 640
          final_height: 480
          scroll_step: 15
          time_per_frame: 100
          start_delay: 4000

      - name: 🚀 Publish to the cv-preview release
        run: |
          test -s cv-preview.gif || { echo "no GIF was produced"; exit 1; }
          ls -la cv-preview.gif
          gh release delete cv-preview --cleanup-tag --yes || true
          gh release create cv-preview cv-preview.gif \
            --title "CV preview GIF" \
            --notes "Preview recording of https://mrtysn.github.io/cv/ (commit ${{ github.sha }}). Referenced by README.md."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
