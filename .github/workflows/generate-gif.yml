# The preview GIF is recorded from the build in hand and published as a release
# asset, never committed.
#
# It used to be recorded and pushed back to master on every src/ change. The
# recording is not deterministic, so every run produced a different ~6 MB binary
# and the "did anything change?" guard never fired. Twenty-one revisions put
# .git at 98 MB for a repo that is otherwise a few hundred KB, and the bot's
# push raced every human push to master. Releases hold binaries without touching
# history, and the download URL is stable across delete + recreate, so README.md
# can point at one address forever. The tag must stay dedicated: pdf-generation.yml
# runs `gh release delete cv-latest --cleanup-tag`, so an asset parked there
# would be destroyed on the next PDF build.
#
# The recording itself used to come from PabloLec/website-to-gif, which fetched
# the deployed site rather than this commit — and since deploys are manual, it
# usually captured the previous version. It also drove Firefox under Selenium in
# Docker, unmaintained since May 2024, and died on a marionette crash.
# scripts/record-preview.js does the job in the Chrome that already generates
# the PDF, against the build produced here, in about six seconds.
name: Generate demo gif

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
  workflow_dispatch: # record on demand, e.g. after a styling-only change

# Two overlapping runs would publish to the same release and race each other.
concurrency:
  group: cv-preview-gif
  cancel-in-progress: true

permissions:
  contents: write # gh release create

jobs:
  generate-gif:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # pnpm latest requires Node >= 22.13

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.27.0 # pinned: pnpm 11 (latest) errors on ignored build scripts

      - name: 📦 Install dependencies
        run: pnpm install
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: 🔧 Install system dependencies for Puppeteer
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm1 libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libxss1 libasound2t64

      - name: 🌐 Install Chrome for Puppeteer
        run: |
          CHROME_PATH=$(npx puppeteer browsers install chrome | grep chrome@ | awk '{print $2}')
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME_PATH" >> $GITHUB_ENV
          echo "Chrome installed at: $CHROME_PATH"

      - name: 🏗️ Build React application
        run: pnpm run build

      - name: 🎬 Record the preview
        run: node scripts/record-preview.js

      - name: 🚀 Publish to the cv-preview release
        run: |
          test -s cv-preview.gif || { echo "no GIF was produced"; exit 1; }
          ls -la cv-preview.gif
          gh release delete cv-preview --cleanup-tag --yes || true
          gh release create cv-preview cv-preview.gif \
            --title "CV preview GIF" \
            --notes "Preview recording of the site at commit ${{ github.sha }}. Referenced by README.md."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
