<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <!-- Meta tags for better mobile browser compatibility -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- Content Security Policy to allow external resources -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:; img-src 'self' https: data: blob:;" />
    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />
    <!-- Use explicit HTTPS for CDN resources to avoid issues with redirects -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/semantic-ui/2.2.12/semantic.min.css"
      crossorigin="anonymous"
    />
    <title>Mert Yaşin CV</title>
    <style>
      /*
        Ubuntu is self-hosted rather than loaded from Google Fonts, and each
        weight is one file with no unicode-range. The css2 API splits latin and
        latin-ext into separate @font-face rules, which makes Chrome embed two
        font resources per weight in the printed PDF. Every ş, ğ and İ then sits
        in a different resource from the letters around it, so a text extractor
        reads the name as "Mert Ya ş in". One file per weight keeps words whole.
        Files carry latin + latin-ext, 570 glyphs each. See PROGRESS.md for how
        they were produced.
      */
      @font-face {
        font-family: 'Ubuntu';
        font-style: normal;
        font-weight: 300;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/ubuntu-300.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Ubuntu';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/ubuntu-400.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Ubuntu';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/ubuntu-500.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Ubuntu';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/ubuntu-700.woff2') format('woff2');
      }

      /* Loading indicator visible while app loads */
      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        text-align: center;
        color: #333;
      }
      #loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #2185d0;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 20px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .app-loaded #loading {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
